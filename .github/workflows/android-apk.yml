# Builds the Android APK (EAS "preview" profile) on a GitHub runner with
# `eas build --local`, so it doesn't count against the Expo plan's cloud builds.
# Signing still uses the keystore stored on Expo, so the APK installs over earlier ones.
# One-time setup: expo.dev → Account settings → Access tokens → Create; paste the token
# into the repository secret EXPO_TOKEN (Settings → Secrets and variables → Actions).
# Run: Actions → Android APK → Run workflow; the APK is under the run's Artifacts.
# Target expo-android / expo-ios / expo-all queues a cloud build on Expo instead.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'apk — собрать APK здесь; expo-android / expo-ios / expo-all — сборка на серверах Expo; update — обновление без переустановки (EAS Update, канал preview); ios-store — iOS для App Store с отправкой в App Store Connect'
        type: choice
        default: apk
        options: [apk, update, expo-android, expo-ios, expo-all, ios-store]
      build_id:
        description: 'ios-store: id уже запущенной сборки Expo — дождаться её и отправить, не собирая заново'
        required: false
        default: ''

permissions:
  contents: read

# One queue per target: publishing an update must not cancel an APK build.
concurrency:
  group: android-apk-${{ inputs.target || 'apk' }}
  cancel-in-progress: true

jobs:
  # Cloud build on Expo's servers (preview profile, internal distribution): the build
  # and its install link/QR show up on expo.dev; the job only queues it.
  # Over-the-air update for installed builds whose native part matches (fingerprint
  # runtime version): new JavaScript and the map page, no reinstall.
  update:
    if: ${{ inputs.target == 'update' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Publish the update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # The build profile's env doesn't apply to updates: same public Firebase config.
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyDOQqQAbRsYvImiaw0Bx0Xwr0gx4e-SV70
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: airsoftcalendar.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: airsoftcalendar
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: airsoftcalendar.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '54382632962'
          EXPO_PUBLIC_FIREBASE_APP_ID: 1:54382632962:web:19462dc47ad704c997071b
        run: |
          msg="$(git log -1 --pretty=%s)"
          npx -y eas-cli@latest update --channel preview --platform all --message "$msg" --non-interactive

  expo:
    if: ${{ startsWith(inputs.target, 'expo-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Queue the build on Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          TARGET: ${{ inputs.target }}
        run: |
          platform="${TARGET#expo-}"
          npx -y eas-cli@latest build --platform "$platform" --profile preview --non-interactive --no-wait

  # App Store build (production profile) from a clean checkout, then submitted to App
  # Store Connect with the credentials and API key stored on Expo. Waits for the result and,
  # if the build fails, prints the end of each build phase log here.
  ios-store:
    if: ${{ inputs.target == 'ios-store' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          id="$BUILD_ID"
          if [ -z "$id" ]; then
            npx -y eas-cli@latest build --platform ios --profile production --non-interactive --no-wait --json > queued.json
            cat queued.json
            id="$(node -e 'const b=JSON.parse(require("fs").readFileSync("queued.json","utf8"));console.log((Array.isArray(b)?b[0]:b).id)')"
          fi
          echo "Build $id"
          for i in $(seq 1 100); do
            sleep 60
            npx -y eas-cli@latest build:view "$id" --json > build.json 2>/dev/null || continue
            status="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("build.json","utf8")).status)')"
            echo "$(date -u +%H:%M) $status"
            case "$status" in
              FINISHED)
                npx -y eas-cli@latest submit --platform ios --profile production --id "$id" --non-interactive
                exit $?;;
              ERRORED|CANCELED) break;;
            esac
          done
          node -e '
            const b = JSON.parse(require("fs").readFileSync("build.json", "utf8"));
            console.log(JSON.stringify(b.error || {}, null, 2));
            for (const u of b.logFiles || []) console.log(u);
          ' > logs.txt
          cat logs.txt
          grep '^https' logs.txt | while read -r url; do
            echo "=== log"
            curl -sL "$url" | node -e '
              let t = ""; process.stdin.on("data", (d) => (t += d)).on("end", () => {
                const out = [];
                for (const line of t.split("\n")) {
                  try { const j = JSON.parse(line); out.push(`[${j.phase || ""}] ${j.msg || ""}`); } catch { out.push(line); }
                }
                const bad = out.map((l, i) => (/error|fail|exception/i.test(l) ? i : -1)).filter((i) => i >= 0);
                const from = bad.length ? Math.max(0, bad[0] - 40) : Math.max(0, out.length - 150);
                console.log(out.slice(from, from + 250).join("\n"));
              });'
          done
          exit 1

  apk:
    if: ${{ inputs.target == '' || inputs.target == 'apk' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The Android build (Gradle, NDK, intermediates) needs ~20 GB; the runner image
      # ships with tools we don't use. Keep the Android SDK (/usr/local/lib/android).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules /usr/local/share/powershell /usr/local/julia* \
            /usr/share/miniconda /opt/az /usr/local/aws-cli /usr/local/share/chromium /usr/lib/google-cloud-sdk || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo rm -rf "$ANDROID_HOME/emulator" "$ANDROID_HOME/system-images" || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Check the Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN repository secret first (see the top of this file)."
            exit 1
          fi
      - run: npm ci
      - name: Build APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Real phones only (no x86 emulator builds): half the native work and disk.
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a,armeabi-v7a
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
        run: npx -y eas-cli@latest build --platform android --profile preview --local --non-interactive --output "$RUNNER_TEMP/grimmap.apk"
      - name: Disk left
        if: always()
        run: df -h /
      - name: Name the APK after the app version
        run: |
          v=$(node -p "require('./app.json').expo.version")
          mkdir -p out && cp "$RUNNER_TEMP/grimmap.apk" "out/GrimMap-$v.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: GrimMap-apk
          path: out/*.apk
          retention-days: 30
